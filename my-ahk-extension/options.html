<!DOCTYPE html>
<html>
<head>
    <title>AHK Text Selector Options</title>
    <style>
        body { font-family: sans-serif; padding: 10px; width: 300px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 5px; margin-bottom: 10px; box-sizing: border-box; }
        button { padding: 8px 15px; }
        #status { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>AHK Script Path</h1>
    <p>Enter the full path to your main .ahk script.</p>

    <label for="scriptPath">AHK Script Path:</label>
    <input type="text" id="scriptPath" name="scriptPath">

    <button id="save">Save</button>

    <div id="status"></div>

    <script src="options.js"></script>
</body>
</html>
